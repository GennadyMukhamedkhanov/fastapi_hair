services:
  redis:
    image: redis:7-alpine
    container_name: hair_shop_redis_prod
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    networks:
      - hair_network

  db:
    image: postgres:16-alpine
    container_name: hair_shop_postgres_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    networks:
      - hair_network

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: hair_shop_web_prod
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      - media_data:/home/fast/media
      - backup_data:/home/fast/backups
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - BACKUP_DIR=/home/fast/backups
      # Переменные для бэкапов
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=5432
      - DEBUG=False
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - hair_network

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: hair_shop_celery_worker_prod
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - media_data:/home/fast/media
      - backup_data:/home/fast/backups
    env_file:
      - .env.prod
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - BACKUP_DIR=/home/fast/backups
      # Переменные для бэкапов - ВАЖНО!
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=5432
      - DEBUG=False
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - hair_network

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: hair_shop_celery_beat_prod
    command: celery -A app.celery_app beat --loglevel=info
    volumes:
      - backup_data:/home/fast/backups
    env_file:
      - .env.prod
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - BACKUP_DIR=/home/fast/backups
      # Переменные для бэкапов - ВАЖНО!
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=5432
      - DEBUG=False
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
    restart: always
    networks:
      - hair_network

  flower:
    image: mher/flower:latest
    container_name: hair_shop_flower_prod
    command: celery -A app.celery_app flower --port=5555 --broker=redis://redis:6379/0
    environment:
      - REDIS_PASSWORD=
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery_worker
    restart: always
    networks:
      - hair_network

  nginx:
    image: nginx:alpine
    container_name: hair_shop_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./app/common/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - media_data:/var/www/media
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - web
    restart: always
    networks:
      - hair_network

volumes:
  postgres_data:
  media_data:
  redis_data:
  backup_data:

networks:
  hair_network:
    driver: bridge