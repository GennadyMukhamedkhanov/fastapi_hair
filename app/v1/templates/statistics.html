<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/v1/static/css/statistics.css">
</head>
<body>
    <div class="container">
        <!-- Шапка -->
        <div class="page-header">
            <div class="header-left">
                <h1>📊 {{ title }}</h1>
            </div>
            <div class="header-right">
                <button class="btn-home" type="button" onclick="location.href='/v1/index/'">
                    🏠 На главную
                </button>
            </div>
        </div>

        <!-- Сетка с кнопками -->
        <div class="stats-grid">
            <!-- Кнопка-заглушка 1 -->
            <div class="stat-card">
                <div class="stat-icon">📈</div>
                <h3>Продажи</h3>
                <p>Статистика по продажам</p>
                <button class="btn-stat" type="button" onclick="showMessage('Продажи')">
                    Перейти
                </button>
            </div>

            <!-- Кнопка-заглушка 2 -->
            <div class="stat-card">
                <div class="stat-icon">💰</div>
                <h3>Выручка</h3>
                <p>Аналитика по выручке</p>
                <button class="btn-stat" type="button" onclick="showMessage('Выручка')">
                    Перейти
                </button>
            </div>

            <!-- Кнопка-заглушка 3 -->
            <div class="stat-card">
                <div class="stat-icon">📦</div>
                <h3>Товары</h3>
                <p>Остатки и оборачиваемость</p>
                <button class="btn-stat" type="button" onclick="showMessage('Товары')">
                    Перейти
                </button>
            </div>

            <!-- Кнопка-заглушка 4 -->
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <h3>Клиенты</h3>
                <p>Аналитика по клиентам</p>
                <button class="btn-stat" type="button" onclick="showMessage('Клиенты')">
                    Перейти
                </button>
            </div>

            <!-- Кнопка-заглушка 5 -->
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <h3>Отчёты</h3>
                <p>Генерация отчётов</p>
                <button class="btn-stat" type="button" onclick="showMessage('Отчёты')">
                    Перейти
                </button>
            </div>

            <!-- Кнопка BACKUPS (показывается только если button_backups = True) -->
            {% if button_backups %}
            <div class="stat-card stat-card-backup">
                <div class="stat-icon">💾</div>
                <h3>Backups</h3>
                <p>Управление резервными копиями</p>
                <button class="btn-backup" type="button" onclick="location.href='/v1/backups/'">
                    💾 Перейти к бэкапам
                </button>
            </div>
            {% endif %}
        </div>



    <script>
        function showMessage(section) {
            alert(`🔧 Раздел "${section}" в разработке. Функционал будет добавлен позже.`);
        }
    </script>
</body>
</html>
